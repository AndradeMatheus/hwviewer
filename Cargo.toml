[package]
name = "hwviewer"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
description = "HWiNFO sensor viewer: desktop widget, web UI, HWiNFO watchdog and in-game OSD"
publish = false

[[bin]]
name = "hwviewer"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
serde_json = { version = "1", features = ["preserve_order"] } # catalog/settings keep their key order
tiny_http = "0.12"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# panic stays "unwind": worker threads catch panics and keep serving (see CLAUDE.md)
